button,#mapActionChooser button,.leaflet-popup-content button{font-weight:400!important}
#quickPlaceBtn,#addCategoryBtn.list-category-btn,#actionAddPin,#actionFindAreas{background:#34a853!important;color:#fff!important}
#actionRenameArea,#actionChangeAreaCategory{background:#666!important;color:#fff!important}
#actionRemoveArea{background:#e53935!important;color:#fff!important}
#mapActionChooser.area-context{width:min(250px,calc(100vw - 32px))!important}
#mapActionChooser.area-context #actionCancel{display:block!important;width:100%!important;margin-top:8px!important;background:#e5e5ea!important;color:#111!important}
@media (pointer:coarse),(max-width:600px){
 #mapActionChooser.area-context{width:min(242px,calc(var(--app-vw) - 28px))!important}
}
/* Untere Hauptaktionen */
#back{background:#007aff!important;color:#fff!important}
/* Im Pin-Popup soll "Name ändern" grün sein. */
.leaflet-popup-content button[data-rename-pin]{background:#34a853!important;color:#fff!important}
/* Bestehendes bearbeiten: grau */
.leaflet-popup-content button[data-rename-pin],
.leaflet-popup-content button[data-change-pin-category]{
  background:#666!important;
  color:#fff!important;
}
/* Permanente Kartenaktionen: weiß/schwarz */
#back{
  background:rgba(255,255,255,.96)!important;
  color:#111!important;
}
#quickPlaceBtn{
  background:rgba(255,255,255,.96)!important;
  color:#111!important;
}
#quickPlaceBtn{
  border:1px solid #bbb!important;
}
#quickPlaceBtn.quick-pin-btn{background:#f7d6d6!important;color:#8f1f1f!important;border:1px solid #dfa8a8!important}
/* Änderungsaktionen: wie Abbrechen hellgrau, mit schwarzer Schrift */
#mapActionChooser #actionRenameArea,
#mapActionChooser #actionChangeAreaCategory,
.leaflet-popup-content button[data-rename-pin],
.leaflet-popup-content button[data-change-pin-category],
#categoryEditSave{
  background:#e5e5ea!important;
  color:#111!important;
}


/* Aktionsdialog: Abbrechen + mobile Darstellung */
#mapActionChooser #actionCancel{
  display:block!important;
  width:100%!important;
  margin-top:8px!important;
  background:#e5e5ea!important;
  color:#111!important;
}
/* Mobil: allgemeiner Long-Press-Dialog vollständig anzeigen */
@media (pointer:coarse), (max-width:600px){
  #mapActionChooser{
    height:auto!important;
    max-height:none!important;
    overflow:visible!important;
    padding-bottom:16px!important;
  }
  #mapActionChooser #actionCancel{
    display:block!important;
    position:static!important;
    visibility:visible!important;
    opacity:1!important;
    width:100%!important;
    min-height:42px!important;
    margin:8px 0 0!important;
    background:#e5e5ea!important;
    color:#111!important;
    pointer-events:auto!important;
  }
}
.route-modes{display:flex;gap:5px;margin:6px 0}.route-modes button{padding:4px 9px!important;min-width:38px;background:#e5e5ea!important;color:#111!important;border:1px solid transparent!important;font-size:17px!important;line-height:1.2!important}.route-modes button.active{background:#0a84ff!important;color:#fff!important;border-color:#0a84ff!important}.transit-time-controls{display:none;align-items:center;gap:5px;margin:5px 0 6px;flex-wrap:wrap}.transit-time-controls.show{display:flex}.transit-time-controls select,.transit-time-controls input{font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:5px 7px;border:1px solid #c7c7cc;border-radius:7px;background:#fff;color:#111;min-height:32px}.transit-time-controls input{font-size:16px;max-width:205px}

/* Mobile: die drei Projektaktionen kompakt und mittig; die linke Zoom-Spalte bleibt frei. */
@media (max-width:600px) and (pointer:coarse){
  .bottom{
    left:50%!important;
    right:auto!important;
    width:auto!important;
    max-width:calc(var(--app-vw) - 144px)!important;
    transform:translateX(-50%)!important;
    justify-content:center!important;
    gap:8px!important;
  }
  .bottom .back{padding-left:18px!important;padding-right:18px!important;white-space:nowrap!important}
}

}
function pointInLatLngs(lat,lng,lls){

 if(lls[0]&&typeof lls[0].lat==='number')return pointInRing(lat,lng,lls);
 for(var i=0;i<lls.length;i++)if(pointInLatLngs(lat,lng,lls[i]))return true;

}

}
