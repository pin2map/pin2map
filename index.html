/* Untere Hauptaktionen */
#back{background:#007aff!important;color:#fff!important}
/* Im Pin-Popup soll "Name ändern" grün sein. */
.leaflet-popup-content button[data-rename-pin]{background:#34a853!important;color:#fff!important}
/* Bestehendes bearbeiten: grau */
.leaflet-popup-content button[data-rename-pin],
.leaflet-popup-content button[data-change-pin-category]{
  background:#666!important;
  color:#fff!important;
}
/* Permanente Kartenaktionen: weiß/schwarz */
#back{
  background:rgba(255,255,255,.96)!important;
  color:#111!important;
}
#quickPlaceBtn{
  background:rgba(255,255,255,.96)!important;
  color:#111!important;
}
#quickPlaceBtn{
  border:1px solid #bbb!important;
}
/* Änderungsaktionen: wie Abbrechen hellgrau, mit schwarzer Schrift */
#mapActionChooser #actionRenameArea,
#mapActionChooser #actionChangeAreaCategory,
.leaflet-popup-content button[data-rename-pin],
.leaflet-popup-content button[data-change-pin-category],
#categoryEditSave{
  background:#e5e5ea!important;
  color:#111!important;
}


/* Aktionsdialog: Abbrechen + mobile Darstellung */
#mapActionChooser #actionCancel{
  display:block!important;
  width:100%!important;
  margin-top:8px!important;
  background:#e5e5ea!important;
  color:#111!important;
}
/* Mobil: allgemeiner Long-Press-Dialog vollständig anzeigen */
@media (pointer:coarse), (max-width:600px){
  #mapActionChooser{

    max-height:none!important;
    overflow:visible!important;

    margin:8px 0 0!important;

    color:#111!important;
    pointer-events:auto!important;

function findAreasAt(ll){
 var box=document.getElementById('areaSearchBox'),res=document.getElementById('areaSearchResults');
 document.getElementById('areaSearchPoint').textContent=ll.lat.toFixed(6)+', '+ll.lng.toFixed(6);
 res.innerHTML='<div style="padding:12px 0">⏳ Nominatim wird abgefragt …</div>';
 document.getElementById('manualAreaQuery').value='';
 document.getElementById('manualAreaResults').innerHTML='';
 box.style.display='block';
 centerAreaSearchBoxDesktop();

 var url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat='+
  encodeURIComponent(ll.lat)+'&lon='+encodeURIComponent(ll.lng);
 var controller=window.AbortController?new AbortController():null;
 var timer=controller?setTimeout(function(){controller.abort()},12000):null;
 var opts={headers:{'Accept-Language':'de'}};
 if(controller)opts.signal=controller.signal;

 fetch(url,opts).then(function(r){
  if(timer)clearTimeout(timer);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json()
 }).then(function(data){
  var rows=[],seen={};
  function add(kind,name,extra){
   if(!name)return;
   var key=kind+'|'+name;if(seen[key])return;seen[key]=1;
   rows.push({kind:kind,name:name,extra:extra||'',query:name,label:name})
  }

  if(data.name){
   add(data.type||data.category||'OSM-Objekt',data.name,
    'OSM '+(data.osm_type||'')+' '+(data.osm_id||'')+
    (data.category?' · category='+data.category:'')+(data.type?' · type='+data.type:''))
  }

  var a=data.address||{};
  var order=['neighbourhood','quarter','suburb','city_district','borough','village','town','city',
             'municipality','county','state_district','region','state','country'];
  for(var i=0;i<order.length;i++){
   var k=order[i];
   if(a[k])add(k,a[k],k+(a.country_code?' · '+a.country_code.toUpperCase():''))
  }

  if(!rows.length){
   res.innerHTML='<div style="padding:10px 0">Nominatim hat für diesen Punkt keine Gebietshierarchie zurückgegeben.</div>';
   centerAreaSearchBoxDesktop();
   return
  }
  res.innerHTML='';
  rows.forEach(function(x){
   var d=document.createElement('div');
   d.style.cssText='padding:9px 0;border-bottom:1px solid #ddd;cursor:pointer;border-radius:8px';
   d.setAttribute('role','button');d.setAttribute('tabindex','0');
   d.innerHTML='<div style="font-weight:700">'+esc(osmTypeLabel(x.kind))+' — '+esc(x.name)+'</div>'+
    '<div style="font-size:11px;color:#666;margin-top:3px;word-break:break-word">'+esc(x.extra)+'</div>'+
    '<div style="font-size:11px;color:#007aff;margin-top:3px">Antippen, um diese Fläche hinzuzufügen</div>';
   d.onclick=function(){chooseCategoryForArea({query:x.query,label:x.label})};
   d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();d.click()}};
   res.appendChild(d)
  });
  centerAreaSearchBoxDesktop();
 }).catch(function(e){
  if(timer)clearTimeout(timer);
  res.innerHTML='<div style="padding:10px 0;color:#b00020"><b>Abfrage fehlgeschlagen.</b><br>'+
   esc(e.name==='AbortError'?'Zeitüberschreitung':e.message)+'</div>';
  centerAreaSearchBoxDesktop()
 })
}
function installMapPinGestures(){
 var mapEl=document.getElementById('map');
 if(!mapEl)return;

 /* Browser-Auswahl/Callout auf der Karte unterdrücken, aber unser Kontextmenü selbst auslösen. */
 if(!mapEl.dataset.pin2mapContextInstalled){
  mapEl.dataset.pin2mapContextInstalled='1';
  mapEl.addEventListener('contextmenu',function(ev){
   ev.preventDefault();ev.stopPropagation();
   var target=ev.target;
   if(target&&target.closest&&target.closest('.leaflet-control,.map-ui-control,.topbar,.legend,.bottom,.label-toggle,.route-info,.leaflet-marker-icon,.leaflet-tooltip,.leaflet-popup'))return;
   var rect=mapEl.getBoundingClientRect();
   addPinAt(map.containerPointToLatLng(L.point(ev.clientX-rect.left,ev.clientY-rect.top)));
  },true);
  mapEl.addEventListener('selectstart',function(ev){ev.preventDefault()},true);
  mapEl.addEventListener('dragstart',function(ev){ev.preventDefault()},true);
 }

 /* Mobile Long-Press direkt am DOM: nach Öffnen bleibt der Dialog bis NACH touchend gesperrt. */
 if(!mapEl.dataset.pin2mapLongPressInstalled){
  mapEl.dataset.pin2mapLongPressInstalled='1';
  var timer=null,start=null,moved=false,longPressOpened=false,uiTouch=false;
  var lastOneTap=0,lastTwoTap=0;
  function clearTimer(){if(timer){clearTimeout(timer);timer=null}}
  function blockedTarget(target){return target&&target.closest&&target.closest('.leaflet-control,.map-ui-control,.topbar,.legend,.bottom,.label-toggle,.route-info,.leaflet-marker-icon,.leaflet-tooltip,.leaflet-popup,#mapActionChooser,#areaClickChooser,#areaSearchBox,#pinCategoryChooser,#placeResultChooser,#categoryEditor,#pinNameEditor,#areaNameEditor')}
  mapEl.addEventListener('touchstart',function(ev){
   if(!ev.touches)return;
   uiTouch=!!blockedTarget(ev.target);
   if(uiTouch){clearTimer();start=null;moved=false;longPressOpened=false;return}
   if(ev.touches.length===1){
    var t=ev.touches[0];start={x:t.clientX,y:t.clientY};moved=false;longPressOpened=false;clearTimer();
    timer=setTimeout(function(){
     timer=null;if(moved||!start)return;
     var rect=mapEl.getBoundingClientRect(),pt=L.point(start.x-rect.left,start.y-rect.top),ll=map.containerPointToLatLng(pt);
     longPressOpened=true;
     addPinAt(ll);
    },650);
   }else{clearTimer();start=null;moved=false}
  },{passive:true});
  mapEl.addEventListener('touchmove',function(ev){
   if(!start||!ev.touches||!ev.touches.length)return;var t=ev.touches[0];
   if(Math.abs(t.clientX-start.x)>10||Math.abs(t.clientY-start.y)>10){moved=true;clearTimer()}
  },{passive:true});
  mapEl.addEventListener('touchend',function(ev){
   clearTimer();
   if(uiTouch){uiTouch=false;start=null;moved=false;longPressOpened=false;return}
   if(longPressOpened){
    /* Nur das Loslassen des auslösenden Long-Press abfangen.
       Der nächste Touch auf das bereits offene Menü muss sofort funktionieren. */
    ev.preventDefault();ev.stopPropagation();
    longPressOpened=false;start=null;moved=false;return;
   }
   if(!moved){
    var now=Date.now(),changed=ev.changedTouches&&ev.changedTouches[0];
    /* Einfinger-Doppeltipp: +1 Zoomstufe. */
    if(ev.touches&&ev.touches.length===0&&changed){
     if(now-lastOneTap<330){
      var rect=mapEl.getBoundingClientRect(),pt=L.point(changed.clientX-rect.left,changed.clientY-rect.top),ll=map.containerPointToLatLng(pt);
      map.setZoomAround(ll,map.getZoom()+1);lastOneTap=0;
     }else lastOneTap=now;
    }
   }
   start=null;moved=false;
  },{passive:false});
  mapEl.addEventListener('touchcancel',function(){clearTimer();start=null;moved=false;longPressOpened=false;uiTouch=false},{passive:true});

  /* Zweifinger-Doppeltipp: zwei kurze 2-Finger-Taps hintereinander = -1 Zoomstufe. */
  var twoActive=false,twoMoved=false,twoCenter=null,twoStart=null;
  mapEl.addEventListener('touchstart',function(ev){
   if(ev.touches&&ev.touches.length===2&&!blockedTarget(ev.target)){
    clearTimer();start=null;twoActive=true;twoMoved=false;
    var a=ev.touches[0],b=ev.touches[1];twoCenter={x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};twoStart=twoCenter;
   }
  },{passive:true});
  mapEl.addEventListener('touchmove',function(ev){
   if(twoActive&&ev.touches&&ev.touches.length===2){var a=ev.touches[0],b=ev.touches[1],c={x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};if(Math.abs(c.x-twoStart.x)>12||Math.abs(c.y-twoStart.y)>12)twoMoved=true}
  },{passive:true});
  mapEl.addEventListener('touchend',function(){
   if(!twoActive)return;
   if(!twoMoved&&twoCenter){var now=Date.now();if(now-lastTwoTap<420){var rect=mapEl.getBoundingClientRect(),ll=map.containerPointToLatLng(L.point(twoCenter.x-rect.left,twoCenter.y-rect.top));map.setZoomAround(ll,map.getZoom()-1);lastTwoTap=0}else lastTwoTap=now}
   twoActive=false;twoCenter=null;twoStart=null;
  },{passive:true});
 }

  /* Dialog-Touches gehören ausschließlich dem Dialog, nicht der Leaflet-Karte. */
  ['mapActionChooser','areaClickChooser','areaSearchBox','pinCategoryChooser','placeResultChooser',
   'categoryEditor','pinNameEditor','areaNameEditor'].forEach(function(id){
    var el=document.getElementById(id);
    if(!el||el.dataset.touchIsolation)return;
    el.dataset.touchIsolation='1';
    el.addEventListener('touchstart',function(ev){ev.stopPropagation()},{passive:true});
    el.addEventListener('touchmove',function(ev){ev.stopPropagation()},{passive:true});
    el.addEventListener('touchend',function(ev){ev.stopPropagation()},{passive:true});
  });

 document.getElementById('pinCategoryCancel').onclick=function(){document.getElementById('pinCategoryChooser').style.display='none'}
}

function pointInRing(lat,lng,ring){
 var inside=false;
 for(var i=0,j=ring.length-1;i<ring.length;j=i++){
  var xi=ring[i].lng,yi=ring[i].lat,xj=ring[j].lng,yj=ring[j].lat;
  var hit=((yi>lat)!=(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi);
  if(hit)inside=!inside
 }
 return inside
}
function pointInLatLngs(lat,lng,lls){
 if(!lls||!lls.length)return false;
 if(lls[0]&&typeof lls[0].lat==='number')return pointInRing(lat,lng,lls);
 for(var i=0;i<lls.length;i++)if(pointInLatLngs(lat,lng,lls[i]))return true;
 return false
}
function areasAtLatLng(ll){
 var out=[];
 for(var i=0;i<renderedAreas.length;i++){
  var a=renderedAreas[i],layers=a.layer.getLayers?a.layer.getLayers():[a.layer],hit=false;
  for(var j=0;j<layers.length&&!hit;j++){
   if(layers[j].getLatLngs&&pointInLatLngs(ll.lat,ll.lng,layers[j].getLatLngs()))hit=true
  }
  if(hit)out.push(a)
 }
 return out
}

function noteMissing(x){if(myBuild!==buildGeneration)return;miss++;missed.push(x.query);var box=document.getElementById('notFoundList');box.innerHTML='<b>⚠️ Nicht gefunden ('+missed.length+')</b><br>'+missed.map(function(v){return '• '+esc(v)}).join('<br>')}

function decodeUrlDataValue(v){
 try{return decodeURIComponent(String(v||'').replace(/\+/g,' '))}catch(e){return String(v||'').replace(/\+/g,' ')}
}
function importListFromUrl(){
 var data=null;
 try{
  var params=new URLSearchParams(window.location.search||'');
  if(params.has('data'))data=params.get('data');
 }catch(e){}
 if(data===null){
  try{
   var search=String(window.location.search||''),m=search.match(/(?:^|[?&])data=([^&]*)/);
   if(m)data=decodeUrlDataValue(m[1]);
  }catch(e){}
 }
 if(data===null){
  try{
   var href=String(window.location.href||''),m2=href.match(/[?&]data=([^&#]*)/);
   if(m2)data=decodeUrlDataValue(m2[1]);
  }catch(e){}
 }
 data=String(data===null?'':data);
 if(!data.trim())return false;
 input.value=data;
 return true
}
function clearImportedDataFromUrl(){
 try{
  var params=new URLSearchParams(window.location.search||'');
  if(!params.has('data'))return;
  params.delete('data');
  var clean=window.location.pathname+(params.toString()?'?'+params.toString():'')+window.location.hash;
  if(window.history&&history.replaceState)history.replaceState(null,'',clean)
 }catch(e){}
}

function collectProjectCache(){
 var cache={},seen={};
 function addPin(it){if(!it||!it._pinLayer)return;var key=projectCacheKey(it);if(!key||seen['p:'+key])return;seen['p:'+key]=1;var ll=it._pinLayer.getLatLng();cache[key]={kind:'pin',lat:ll.lat,lon:ll.lng,display_name:it.query||it.label||''}}
 for(var id in pinDeleteItems)addPin(pinDeleteItems[id]);
 for(var i=0;i<renderedAreas.length;i++){var a=renderedAreas[i],it=a&&a.item,key=projectCacheKey(it);if(!it||!a.layer||!key||seen['a:'+key])continue;seen['a:'+key]=1;try{var gj=a.layer.toGeoJSON(),geom=gj&&gj.type==='FeatureCollection'?(gj.features.length===1?gj.features[0].geometry:{type:'GeometryCollection',geometries:gj.features.map(function(f){return f.geometry})}):(gj.type==='Feature'?gj.geometry:gj);var b=a.layer.getBounds(),c=b&&b.isValid&&b.isValid()?b.getCenter():null;cache[key]={kind:'area',lat:c?c.lat:null,lon:c?c.lng:null,display_name:it.query||it.label||'',geometry:geom}}catch(e){}
 }

}

 base=String(base).replace(/\.pin2map$/i,'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,60)||'pin2map';

function savePin2MapProject(){

 if(!name)return;

  try{
   var file=new File([blob],name,{type:'application/json'});

    navigator.share({files:[file]}).then(function(){mapStatus.textContent='✓ pin2map-Datei zum Sichern übergeben.'}).catch(function(e){if(e&&e.name==='AbortError')return;downloadProjectBlob(blob,name)});
    return

}
